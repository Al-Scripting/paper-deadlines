<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Deadlines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4ef;--panel:#fff;--ink:#1c1c1f;--muted:#6b6b73;--line:#e2e0d8;--col:#ecebe5;--red:#c8372a;--amber:#a86b12;--ok:#2f7d55;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--panel:#1c1c20;--ink:#ececf0;--muted:#9a9aa6;--line:#2c2c33;--col:#17171a;--red:#ff6b5b;--amber:#f0b44c;--ok:#5fd39a;--shadow:none}}
:root[data-theme="dark"]{--bg:#121214;--panel:#1c1c20;--ink:#ececf0;--muted:#9a9aa6;--line:#2c2c33;--col:#17171a;--red:#ff6b5b;--amber:#f0b44c;--ok:#5fd39a;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}
header h1{font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,.btn,select,input[type=text]{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button,.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .num{font-size:44px;line-height:1;letter-spacing:-.03em}
.stat .lbl{color:var(--muted);font-size:13px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:36px}
.tile{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.tile h3{font-size:18px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--col);color:var(--muted)}
.dl{display:flex;justify-content:space-between;font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.dl b{font-variant-numeric:tabular-nums}
.urgent{color:var(--red)}.soon{color:var(--amber)}.past{color:var(--muted);text-decoration:line-through}
.bar{height:8px;background:var(--col);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.prog{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.note{font-size:12px;color:var(--muted)}
.sec{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 12px}
.sec h2{font-size:20px}
form.add{display:flex;gap:6px;flex-wrap:wrap}
form.add input{min-width:200px;flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--col);border-radius:14px;padding:10px;min-height:160px}
.col.over{outline:2px dashed var(--muted)}
.col h3{font-size:14px;display:flex;justify-content:space-between;padding:4px 6px 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.card .t{font-weight:500;margin-bottom:6px;overflow-wrap:anywhere}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.card .acts{display:flex;gap:2px}
.card .acts button{padding:2px 7px;font-size:12px}
.done .t{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Paper Deadlines</h1><div class="sub" id="today"></div></div>
    <div class="tools">
      <button id="theme" type="button" aria-label="Change the color theme">◐ Theme</button>
      <button id="export" type="button">Export JSON</button>
      <label class="btn">Import JSON<input id="import" type="file" accept="application/json" hidden></label>
    </div>
  </header>

  <section aria-labelledby="dash-h">
    <h2 id="dash-h" class="sec">Dashboard</h2>
    <div class="hero" id="hero"></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section aria-labelledby="board-h">
    <div class="sec">
      <h2 id="board-h">Board</h2>
      <form class="add" id="add">
        <input type="text" id="newTitle" placeholder="New task" aria-label="New task" required>
        <select id="newProject" aria-label="Project"></select>
        <button type="submit">Add</button>
      </form>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter by project"></div>
    <div class="board" id="board"></div>
  </section>
</div>

<script>
const DAY = 86400000, KEY = 'paper-deadlines-v1';
const COLS = [['todo','To do'],['doing','Doing'],['done','Done']];

const P = (id,name,kind,venue,color,deadlines,notes='') => ({id,name,kind,venue,color,deadlines,notes,overleaf:''});
const SEED_PROJECTS = [
  P('afterstate','AFTERSTATE','Long','FDG','#e4572e',[['Paper','2027-01-11']],'Contributions: C1 Benchmark · C2 Dataset · C3 Pipeline'),
  P('raven','RAVEN','Poster','CHI','#3b82f6',[['Poster','2027-01-21']]),
  P('subtast','SubTAST – Benchmark','Short / Long','COG','#a855f7',[['Kevin deadline','2026-11-27'],['Long','2027-03-01'],['Short','2027-05-01']]),
  P('dynamesh','Dynamesh','Long','COG','#14b8a6',[['Paper','2027-03-01']]),
  P('rouge','Rouge','Long','COG','#f3a712',[['Paper','2027-03-01']]),
  P('range','Range','Short','FDG','#ec4899',[['Deadline 1','2027-03-08'],['Deadline 2','2027-05-15']]),
  P('strata','STRATA','Short or Long','COG','#29a36a',[['Deadline 1','2027-03-08'],['Deadline 2','2027-05-15']],'Proc-gen graph sketch on the whiteboard'),
  P('fathom','FATHOM','—','FDG','#64748b',[['Paper','2027-03-08']]),
];
const SEED_TASKS = {
  afterstate:['Data','Generalize / Condense','Demo','Framing','Motivation section'],
  raven:['Test sounds','Fix game','User study','Def. layout + future works','More lit review','GAP','Motivations','Def. contributions','Gen figures'],
  subtast:['Data','Pipeline','Testing','GAP','Motivations','Lit review','Contributions','Figs','Other benchmark flaws'],
  dynamesh:['Real server load + game!!','Lit review','GAPs','Regular vs Dynamesh vs + Forecasting','Metrics'],
  rouge:['Games','Optimize','UI','Lit review','Figs','Screenshots'],
  range:['Write'],
  strata:['MGP (Multi Goal Progression)','Holds objective (dynamic)','Proc gen type graph'],
  fathom:['Fix','Latency','Working demo','Update with new version'],
};
const seed = () => ({
  projects: SEED_PROJECTS.map(p => ({...p, deadlines: p.deadlines.map(([label,date]) => ({label,date}))})),
  tasks: Object.entries(SEED_TASKS).flatMap(([project,ts]) => ts.map(title => ({id: crypto.randomUUID(), project, title, status:'todo'}))),
  filter: 'all',
});

function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (valid(s)) return s; } catch {} return seed(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} render(); }
function valid(s){ return s && Array.isArray(s.projects) && Array.isArray(s.tasks); }
let S = load();

const midnight = d => { d = new Date(d); d.setHours(0,0,0,0); return d; };
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const daysLeft = (s, now = midnight(new Date())) => Math.round((parse(s) - now) / DAY); // round absorbs DST hour
console.assert(daysLeft('2026-11-27', new Date(2026,10,13)) === 14, 'daysLeft: 14 days');
console.assert(daysLeft('2027-03-08', new Date(2027,2,1)) === 7, 'daysLeft across DST');
const fmt = s => parse(s).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
const nextDl = p => p.deadlines.find(d => daysLeft(d.date) >= 0) || p.deadlines[p.deadlines.length-1];
const cls = n => n < 0 ? 'past' : n <= 14 ? 'urgent' : n <= 45 ? 'soon' : '';
const left = n => n < 0 ? 'passed' : n === 0 ? 'today' : n === 1 ? '1 day' : n + ' days';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const proj = id => S.projects.find(p => p.id === id);
const $ = id => document.getElementById(id);

function render(){
  $('today').textContent = 'Today: ' + new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const sorted = [...S.projects].sort((a,b) => daysLeft(nextDl(a).date) - daysLeft(nextDl(b).date));

  // hero
  const upcoming = S.projects.flatMap(p => p.deadlines.map(d => ({p, d, n: daysLeft(d.date)}))).filter(x => x.n >= 0).sort((a,b) => a.n - b.n);
  const nx = upcoming[0], done = S.tasks.filter(t => t.status === 'done').length, total = S.tasks.length;
  const within30 = upcoming.filter(x => x.n <= 30).length;
  $('hero').innerHTML = (nx ? `<div class="stat"><div class="num ${cls(nx.n)}">${left(nx.n)}</div><div class="lbl">until <b>${esc(nx.p.name)}</b> · ${esc(nx.d.label)} (${fmt(nx.d.date)})</div></div>` : '')
    + `<div class="stat"><div class="num">${total ? Math.round(done/total*100) : 0}%</div><div class="lbl">${done} of ${total} tasks done</div></div>`
    + `<div class="stat"><div class="num">${within30}</div><div class="lbl">deadlines in the next 30 days</div></div>`;

  // tiles
  $('tiles').innerHTML = sorted.map(p => {
    const ts = S.tasks.filter(t => t.project === p.id), d = ts.filter(t => t.status === 'done').length, pct = ts.length ? Math.round(d/ts.length*100) : 0;
    return `<article class="tile" style="--c:${p.color}">
      <div><h3>${esc(p.name)}</h3><span class="chip">${esc(p.kind)}</span> <span class="chip">${esc(p.venue)}</span></div>
      ${p.deadlines.map(x => { const n = daysLeft(x.date); return `<div class="dl"><span>${esc(x.label)} · ${fmt(x.date)}</span><b class="${cls(n)}">${left(n)}</b></div>`; }).join('')}
      <div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(p.name)} progress"><i style="width:${pct}%"></i></div>
      <div class="prog"><span>${d}/${ts.length} tasks</span><span>${pct}%</span></div></div>
      ${p.notes ? `<div class="note">${esc(p.notes)}</div>` : ''}
      <div class="links">
        ${p.overleaf ? `<a class="btn" href="${esc(p.overleaf)}" target="_blank" rel="noopener">Overleaf ↗</a>` : ''}
        <button type="button" data-ol="${p.id}">${p.overleaf ? 'Edit link' : '+ Overleaf link'}</button>
      </div></article>`;
  }).join('');

  // add form + filters
  $('newProject').innerHTML = S.projects.map(p => `<option value="${p.id}" ${S.filter === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  $('filters').innerHTML = [{id:'all', name:'All'}, ...sorted].map(p => `<button type="button" data-f="${p.id}" aria-pressed="${S.filter === p.id}" ${p.color ? `style="border-left:4px solid ${p.color}"` : ''}>${esc(p.name)}</button>`).join('');

  // board
  const vis = S.tasks.filter(t => S.filter === 'all' || t.project === S.filter);
  $('board').innerHTML = COLS.map(([k,label], i) => {
    const cards = vis.filter(t => t.status === k).sort((a,b) => daysLeft(nextDl(proj(a.project)).date) - daysLeft(nextDl(proj(b.project)).date));
    return `<div class="col" data-col="${k}"><h3><span>${label}</span><span>${cards.length}</span></h3>${cards.map(t => {
      const p = proj(t.project), dl = nextDl(p), n = daysLeft(dl.date);
      return `<div class="card ${k}" draggable="true" data-id="${t.id}" style="--c:${p.color}">
        <div class="t">${esc(t.title)}</div>
        <div class="m"><span>${esc(p.name)} · <span class="${cls(n)}">${fmt(dl.date)} (${left(n)})</span></span>
        <span class="acts">
          ${i > 0 ? `<button type="button" data-mv="${t.id}" data-to="${COLS[i-1][0]}" aria-label="Move to ${COLS[i-1][1]}">←</button>` : ''}
          ${i < 2 ? `<button type="button" data-mv="${t.id}" data-to="${COLS[i+1][0]}" aria-label="Move to ${COLS[i+1][1]}">→</button>` : ''}
          <button type="button" data-del="${t.id}" aria-label="Delete task">×</button>
        </span></div></div>`;
    }).join('')}</div>`;
  }).join('');
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.f) { S.filter = b.dataset.f; save(); }
  else if (b.dataset.mv) { S.tasks.find(t => t.id === b.dataset.mv).status = b.dataset.to; save(); }
  else if (b.dataset.del) { const t = S.tasks.find(t => t.id === b.dataset.del); if (confirm(`Delete "${t.title}"?`)) { S.tasks = S.tasks.filter(x => x !== t); save(); } }
  else if (b.dataset.ol) {
    const p = proj(b.dataset.ol), v = prompt(`Overleaf link for ${p.name} (empty to remove):`, p.overleaf);
    if (v === null) return;
    if (v.trim() && !/^https:\/\//i.test(v.trim())) { alert('Use a full https:// link.'); return; }
    p.overleaf = v.trim(); save();
  }
});

$('add').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('newTitle').value.trim(); if (!title) return;
  S.tasks.push({id: crypto.randomUUID(), project: $('newProject').value, title, status:'todo'});
  $('newTitle').value = ''; save();
});

// drag and drop between columns
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.card'); if (c) e.dataTransfer.setData('text/plain', c.dataset.id); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.col'); if (col) { e.preventDefault(); col.classList.add('over'); } });
document.addEventListener('dragleave', e => { const col = e.target.closest?.('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', e => {
  const col = e.target.closest?.('.col'); if (!col) return;
  e.preventDefault();
  const t = S.tasks.find(t => t.id === e.dataTransfer.getData('text/plain'));
  if (t) { t.status = col.dataset.col; save(); }
});

$('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type:'application/json'}));
  a.download = 'paper-deadlines.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('import').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const s = JSON.parse(await f.text()); if (!valid(s)) throw 0; S = s; save(); }
  catch { alert('That file is not a valid export.'); }
  e.target.value = '';
};

const root = document.documentElement;
try { const th = localStorage.getItem(KEY + '-theme'); if (th) root.dataset.theme = th; } catch {}
$('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(KEY + '-theme', root.dataset.theme); } catch {}
};

render();
</script>
</body>
</html>
